<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shoreline</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d1418; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  #loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg,#1b2a33,#0d1418); color: #cfe3e8; font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 0.08em; z-index: 20; transition: opacity 1.1s ease;
  }
  #loading .title { font-size: 15px; text-transform: uppercase; opacity: 0.85; margin-bottom: 14px; }
  #loading .bar { width: 220px; height: 2px; background: rgba(255,255,255,0.15); position: relative; overflow: hidden; }
  #loading .bar > i { position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: #cfe3e8; animation: sweep 1.3s ease-in-out infinite; }
  @keyframes sweep { 0% { left: -30%; } 100% { left: 100%; } }

  #hint {
    position: fixed; left: 24px; bottom: 20px; max-width: 380px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.82);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    opacity: 0; transition: opacity 1.4s ease; pointer-events: none; z-index: 10;
  }
  #hint.show { opacity: 1; }

  #reticle {
    position: fixed; width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.55); transform: translate(-50%, -50%);
    pointer-events: none; z-index: 9; mix-blend-mode: difference; display: none;
  }

  #compassWrap { position: fixed; top: 18px; right: 18px; z-index: 10; opacity: 0.85; }

  #tideWrap {
    position: fixed; top: 18px; left: 18px; z-index: 10; opacity: 0.8;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px;
    color: rgba(255,255,255,0.75); letter-spacing: 0.06em; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }
  #tideBar { width: 64px; height: 3px; background: rgba(255,255,255,0.18); position: relative; border-radius: 2px; }
  #tideBar > i { position: absolute; top: -2px; width: 2px; height: 7px; background: #bfe0ff; border-radius: 1px; }

  #filmGrade {
    position: fixed; inset: 0; z-index: 6; pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 48%, rgba(0,0,0,0) 48%, rgba(18,14,10,0.30) 100%),
      linear-gradient(rgba(255,205,150,0.05), rgba(255,205,150,0.05));
  }
  #filmGrain {
    position: fixed; inset: 0; z-index: 7; pointer-events: none; opacity: 0.05;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-size: 180px 180px;
  }

  #sound {
    position: fixed; bottom: 20px; right: 22px; z-index: 10;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px;
    color: rgba(255,255,255,0.6); letter-spacing: 0.06em; text-transform: uppercase;
    background: none; border: none; cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,0.6);
  }

  /* Touch controls - shown only on touch-capable devices, see main.js */
  body:not(.touch) #touchUI { display: none; }

  #joystickZone {
    position: fixed; left: 0; bottom: 0; width: 45%; height: 48%; z-index: 12;
    touch-action: none;
  }
  #joystickBase {
    position: fixed; width: 108px; height: 108px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.06);
    display: none; z-index: 13; pointer-events: none;
  }
  #joystickThumb {
    position: fixed; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255,255,255,0.42); border: 1px solid rgba(255,255,255,0.6);
    display: none; z-index: 14; pointer-events: none;
  }

  #digZone {
    position: fixed; right: 0; top: 0; width: 100%; height: 100%; z-index: 8;
    touch-action: none;
  }

  #touchButtons {
    position: fixed; right: 16px; bottom: 56px; z-index: 15;
    display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
  }
  body.touch #sound { bottom: auto; top: 18px; right: 18px; } /* the touch button stack owns the bottom-right corner */
  .tbtn {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 12px; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase;
    color: rgba(255,255,255,0.9); background: rgba(20,25,26,0.55);
    border: 1px solid rgba(255,255,255,0.35); border-radius: 26px;
    padding: 12px 18px; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  .tbtn.active { background: rgba(255,255,255,0.4); color: #10201d; }
  /* Suppress the OS text-selection/"Copy" call-out everywhere in the touch UI, not
     just on buttons - a long-press on the dig/joystick zones triggered it too. */
  #touchUI, #touchUI * {
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #zoomBtns { display: flex; gap: 8px; }
  #zoomBtns .tbtn { width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; border-radius: 50%; }
</style>
</head>
<body>
<div id="app"></div>

<div id="loading">
  <div class="title">Shoreline</div>
  <div class="bar"><i></i></div>
</div>

<div id="hint"></div>
<div id="reticle"></div>
<div id="filmGrade"></div>
<div id="filmGrain"></div>

<div id="tideWrap">
  <span id="tideLabel">Tide</span>
  <div id="tideBar"><i id="tideMarker"></i></div>
</div>

<button id="sound">Sound: on</button>

<div id="touchUI">
  <div id="digZone"></div>
  <div id="joystickZone"></div>
  <div id="joystickBase"></div>
  <div id="joystickThumb"></div>
  <div id="touchButtons">
    <div id="zoomBtns">
      <div class="tbtn" id="zoomInBtn">+</div>
      <div class="tbtn" id="zoomOutBtn">&minus;</div>
    </div>
    <div class="tbtn" id="digBtn">Dig</div>
    <div class="tbtn" id="smoothBtn">Smooth</div>
    <div class="tbtn" id="interactBtn">Pick up</div>
    <div class="tbtn" id="sprintBtn">Sprint</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module" src="./src/main.js?v=32"></script>
</body>
</html>
